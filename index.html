<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>بارینو | سفارش میوه</title>

<style>
body{
font-family:tahoma;
direction:rtl;
margin:0;
background:#f5f5f5;
}

header{
background:#16a34a;
color:white;
text-align:center;
padding:15px;
font-size:22px;
font-weight:bold;
}

.container{
padding:10px;
}

.item{
background:white;
margin:10px 0;
padding:10px;
border-radius:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

button{
background:#16a34a;
color:white;
border:none;
padding:7px 10px;
border-radius:8px;
cursor:pointer;
}

.cart{
background:white;
padding:10px;
margin:10px 0;
border-radius:10px;
}

input{
width:100%;
padding:8px;
margin:5px 0;
border-radius:8px;
border:1px solid #ccc;
}

#orderBtn{
width:100%;
padding:12px;
background:#2563eb;
color:white;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
}
</style>

</head>

<body>

<header>🍎 بارینو | سفارش آنلاین میوه</header>

<div class="container">

<!-- محصولات -->
<div class="item">🍎 سیب <button onclick="add('سیب',50)">افزودن</button></div>
<div class="item">🍌 موز <button onclick="add('موز',60)">افزودن</button></div>
<div class="item">🍊 پرتقال <button onclick="add('پرتقال',40)">افزودن</button></div>
<div class="item">🍇 انگور <button onclick="add('انگور',70)">افزودن</button></div>

<!-- سبد -->
<div class="cart">
<h3>🛒 سبد خرید</h3>
<div id="cart"></div>
<p>💰 جمع کل: <span id="total">0</span> تومان</p>
<button onclick="clearCart()">پاک کردن سبد</button>
</div>

<!-- اطلاعات مشتری -->
<div class="cart">
<h3>👤 اطلاعات مشتری</h3>
<input id="name" placeholder="نام">
<input id="phone" placeholder="شماره تماس">
<input id="address" placeholder="آدرس">
</div>

<button id="orderBtn" onclick="submitOrder()">ثبت سفارش و ارسال به ایتا</button>

</div>

<script>

let cart = [];

function add(name, price){
cart.push({name, price});
render();
}

function render(){
let html = "";
let total = 0;

cart.forEach((p,i)=>{
html += `➖ ${p.name} - ${p.price} تومان<br>`;
total += p.price;
});

document.getElementById("cart").innerHTML = html;
document.getElementById("total").innerText = total;
}

function clearCart(){
cart = [];
render();
}

function submitOrder(){

let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;
let address = document.getElementById("address").value;

let total = cart.reduce((a,b)=>a+b.price,0);

let text = "🛒 سفارش جدید بارینو%0A%0A";

text += "👤 نام: " + name + "%0A";
text += "📞 شماره: " + phone + "%0A";
text += "🏠 آدرس: " + address + "%0A%0A";

text += "📦 سفارش:%0A";

cart.forEach(p=>{
text += "➖ " + p.name + " - " + p.price + " تومان%0A";
});

text += "%0A💰 جمع کل: " + total + " تومان%0A%0A";

text += "📍 کانال: https://eitaa.com/barino_shopp";

// ارسال به ایتا (پیام آماده)
let url = "https://eitaa.com/share/url?text=" + text;

window.open(url, "_blank");

}

</script>

</body>
</html>
