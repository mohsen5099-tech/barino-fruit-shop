<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>میوه فروشی آنلاین</title>
<style>
body {font-family: sans-serif; direction: rtl; background:#f5f5f5; margin:0}
header {background:orange; color:white; padding:15px; text-align:center; font-size:22px}
.item {background:white; margin:10px; padding:10px; border-radius:10px; display:flex; justify-content:space-between; align-items:center}
button {background:green; color:white; border:none; padding:8px 12px; border-radius:8px}
.cart {background:white; padding:10px; margin:10px; border-radius:10px}
input {width:95%; padding:8px; margin:5px 0}
#orderBtn {width:100%; background:blue; padding:12px; font-size:18px}
</style>
</head>
<body>

<header>🍉 بارینو - فروش میوه آنلاین</header>

<div class="item">سیب (هر کیلو 50) <button onclick="add('سیب',50)">افزودن</button></div>
<div class="item">موز (هر کیلو 60) <button onclick="add('موز',60)">افزودن</button></div>
<div class="item">پرتقال (هر کیلو 40) <button onclick="add('پرتقال',40)">افزودن</button></div>
<div class="item">انگور (هر کیلو 70) <button onclick="add('انگور',70)">افزودن</button></div>

<div class="cart">
<h3>🛒 سبد خرید</h3>
<div id="cart"></div>
<p id="total">جمع کل: 0</p>
</div>

<div class="cart">
<h3>👤 اطلاعات مشتری</h3>
<input id="name" placeholder="نام">
<input id="phone" placeholder="شماره تماس">
<input id="address" placeholder="آدرس">
</div>

<button id="orderBtn" onclick="order()">ثبت سفارش در ایتا</button>

<script>
let cart = [];
let total = 0;

function add(name, price){
cart.push({name, price});
total += price;
render();
}

function render(){
let c = "";
cart.forEach((i, index)=>{
c += i.name + " - " + i.price + " تومان<br>";
});
document.getElementById("cart").innerHTML = c;
document.getElementById("total").innerText = "جمع کل: " + total;
}

function order(){
let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;
let address = document.getElementById("address").value;

let text =
"سفارش جدید%0A" +
"نام: " + name + "%0A" +
"شماره: " + phone + "%0A" +
"آدرس: " + address + "%0A%0A" +
"سبد خرید:%0A";

cart.forEach(i=>{
text += i.name + " - " + i.price + "%0A";
});

text += "%0Aجمع کل: " + total;

// لینک ایتا (قابل تغییر)
window.open("https://eitaa.com/share/url?text=" + text);
}
</script>

</body>
</html>
