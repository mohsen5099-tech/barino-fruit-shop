<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>بارینو - فروشگاه میوه</title>

<style>
body{font-family:tahoma;direction:rtl;background:#f3f3f3;margin:0}
header{background:#ff6a00;color:white;padding:15px;text-align:center;font-size:22px}

.container{padding:10px}

.product{
background:white;
padding:10px;
margin:10px 0;
border-radius:12px;
display:flex;
justify-content:space-between;
align-items:center;
}

button{
background:#28a745;
color:white;
border:none;
padding:6px 10px;
border-radius:8px;
}

.cart{
background:white;
padding:10px;
margin:10px 0;
border-radius:12px;
}

input{
width:100%;
padding:8px;
margin:5px 0;
border-radius:8px;
border:1px solid #ddd;
}

#orderBtn{
width:100%;
padding:12px;
background:#007bff;
color:white;
font-size:18px;
border:none;
border-radius:10px;
}

.admin{
background:#fff;
padding:10px;
margin:10px 0;
border-radius:12px;
}

.small{background:red}
</style>
</head>

<body>

<header>🍉 بارینو | فروشگاه حرفه‌ای میوه</header>

<div class="container">

<!-- محصولات -->
<div class="product">سیب (50) <button onclick="add('سیب',50)">افزودن</button></div>
<div class="product">موز (60) <button onclick="add('موز',60)">افزودن</button></div>
<div class="product">پرتقال (40) <button onclick="add('پرتقال',40)">افزودن</button></div>
<div class="product">انگور (70) <button onclick="add('انگور',70)">افزودن</button></div>

<!-- سبد -->
<div class="cart">
<h3>🛒 سبد خرید</h3>
<div id="cart"></div>
<p>جمع کل: <b id="total">0</b></p>
<button class="small" onclick="clearCart()">پاک کردن سبد</button>
</div>

<!-- اطلاعات مشتری -->
<div class="cart">
<h3>👤 اطلاعات مشتری</h3>
<input id="name" placeholder="نام">
<input id="phone" placeholder="شماره تماس">
<input id="address" placeholder="آدرس">
</div>

<button id="orderBtn" onclick="submitOrder()">ثبت سفارش نهایی</button>

<!-- پنل مدیریت -->
<div class="admin">
<h3>📦 سفارش‌های ثبت شده</h3>
<div id="orders"></div>
<button onclick="clearOrders()" class="small">حذف همه سفارش‌ها</button>
</div>

</div>

<script>

let cart = [];

function add(name, price){
cart.push({name, price});
render();
}

function render(){
let html = "";
let total = 0;

cart.forEach((p,i)=>{
html += `
${p.name} - ${p.price}
<button onclick="removeItem(${i})">حذف</button><br>
`;
total += p.price;
});

document.getElementById("cart").innerHTML = html;
document.getElementById("total").innerText = total;

renderOrders();
}

function removeItem(i){
cart.splice(i,1);
render();
}

function clearCart(){
cart = [];
render();
}

function submitOrder(){

let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;
let address = document.getElementById("address").value;

let total = cart.reduce((a,b)=>a+b.price,0);

let text = "🛒 سفارش جدید%0A";
text += "نام: " + name + "%0A";
text += "تلفن: " + phone + "%0A";
text += "آدرس: " + address + "%0A%0A";

cart.forEach(p=>{
text += p.name + " - " + p.price + "%0A";
});

text += "%0A💰 جمع کل: " + total;

// ذخیره کامل سفارش
let orders = JSON.parse(localStorage.getItem("orders") || "[]");
orders.push({
name, phone, address,
cart,
total,
time: new Date().toLocaleString()
});

localStorage.setItem("orders", JSON.stringify(orders));

// ارسال به ایتا
window.open("https://eitaa.com/share/url?text=" + text);

clearCart();
renderOrders();
}

function renderOrders(){

let orders = JSON.parse(localStorage.getItem("orders") || "[]");
let html = "";

orders.forEach((o,i)=>{
html += `
<div style="border-bottom:1px solid #ddd;padding:5px">
<b>${o.name}</b><br>
${o.phone}<br>
${o.address}<br>
💰 ${o.total} تومان<br>
🕒 ${o.time}<br>
</div>
`;
});

document.getElementById("orders").innerHTML = html;
}

function clearOrders(){
localStorage.removeItem("orders");
renderOrders();
}

render();

</script>

</body>
</html>
