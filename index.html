<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>بارینو | فروشگاه حرفه‌ای میوه</title>

<style>
body{
font-family:tahoma;
direction:rtl;
margin:0;
background:#f3f4f6;
}

header{
background:#16a34a;
color:white;
text-align:center;
padding:15px;
font-size:22px;
font-weight:bold;
}

.container{padding:10px}

.product{
background:white;
margin:10px 0;
padding:10px;
border-radius:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

button{
background:#16a34a;
color:white;
border:none;
padding:6px 10px;
border-radius:8px;
cursor:pointer;
}

.qtyBtn{
background:#2563eb;
}

.removeBtn{
background:#ef4444;
}

.cart{
background:white;
padding:10px;
margin:10px 0;
border-radius:10px;
}

input{
width:100%;
padding:8px;
margin:5px 0;
border-radius:8px;
border:1px solid #ccc;
}

#orderBtn{
width:100%;
padding:12px;
background:#0ea5e9;
color:white;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
}
</style>

</head>

<body>

<header>🍎 بارینو | فروشگاه حرفه‌ای میوه</header>

<div class="container">

<!-- محصولات -->
<div class="product">
🍎 سیب (50 تومان)
<button onclick="add('سیب',50)">افزودن</button>
</div>

<div class="product">
🍌 موز (60 تومان)
<button onclick="add('موز',60)">افزودن</button>
</div>

<div class="product">
🍊 پرتقال (40 تومان)
<button onclick="add('پرتقال',40)">افزودن</button>
</div>

<div class="product">
🍇 انگور (70 تومان)
<button onclick="add('انگور',70)">افزودن</button>
</div>

<!-- سبد -->
<div class="cart">
<h3>🛒 سبد خرید</h3>
<div id="cart"></div>
<p>💰 جمع کل: <span id="total">0</span> تومان</p>
<button onclick="clearCart()" class="removeBtn">پاک کردن سبد</button>
</div>

<!-- مشتری -->
<div class="cart">
<h3>👤 اطلاعات مشتری</h3>
<input id="name" placeholder="نام">
<input id="phone" placeholder="شماره">
<input id="address" placeholder="آدرس">
</div>

<button id="orderBtn" onclick="submitOrder()">ثبت سفارش حرفه‌ای</button>

<!-- پنل سفارش -->
<div class="cart">
<h3>📦 سفارش‌های ثبت شده</h3>
<div id="orders"></div>
<button onclick="clearOrders()" class="removeBtn">پاک کردن سفارش‌ها</button>
</div>

</div>

<script>

let cart = [];

function add(name, price){
cart.push({name, price});
render();
}

function render(){

let html = "";
let total = 0;

cart.forEach((p,i)=>{
html += `
➖ ${p.name} - ${p.price}
<button class="removeBtn" onclick="removeItem(${i})">حذف</button><br>
`;
total += p.price;
});

document.getElementById("cart").innerHTML = html;
document.getElementById("total").innerText = total;

renderOrders();
}

function removeItem(i){
cart.splice(i,1);
render();
}

function clearCart(){
cart = [];
render();
}

function submitOrder(){

let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;
let address = document.getElementById("address").value;

let total = cart.reduce((a,b)=>a+b.price,0);

let text = "🛒 سفارش جدید بارینو%0A%0A";

text += "👤 نام: " + name + "%0A";
text += "📞 شماره: " + phone + "%0A";
text += "🏠 آدرس: " + address + "%0A%0A";

cart.forEach(p=>{
text += "➖ " + p.name + " - " + p.price + "%0A";
});

text += "%0A💰 جمع کل: " + total + " تومان%0A";

text += "%0A📍 https://eitaa.com/barino_shopp";

// ارسال به ایتا
let url = "https://eitaa.com/share/url?text=" + encodeURIComponent(text);
window.open(url, "_blank");

// ذخیره سفارش (پنل داخلی)
let orders = JSON.parse(localStorage.getItem("orders") || "[]");

orders.push({
name, phone, address,
cart,
total,
time: new Date().toLocaleString()
});

localStorage.setItem("orders", JSON.stringify(orders));

clearCart();
renderOrders();
}

function renderOrders(){

let orders = JSON.parse(localStorage.getItem("orders") || "[]");
let html = "";

orders.forEach((o)=>{
html += `
<div style="border-bottom:1px solid #ddd;padding:5px">
<b>${o.name}</b><br>
📞 ${o.phone}<br>
🏠 ${o.address}<br>
💰 ${o.total} تومان<br>
🕒 ${o.time}<br>
</div>
`;
});

document.getElementById("orders").innerHTML = html;
}

function clearOrders(){
localStorage.removeItem("orders");
renderOrders();
}

render();

</
