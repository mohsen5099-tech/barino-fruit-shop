<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>بارینو | سفارش میوه</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
font-family:tahoma;
background:#f5f5f5;
direction:rtl;
margin:0;
padding:0;
}

.header{
background:#ff6b00;
color:white;
text-align:center;
padding:20px;
font-size:22px;
font-weight:bold;
}

.item{
background:white;
margin:10px;
padding:10px;
border-radius:10px;
box-shadow:0 0 5px #ccc;
display:flex;
justify-content:space-between;
align-items:center;
}

button{
background:#00c853;
color:white;
border:none;
padding:8px 12px;
border-radius:8px;
}

.total{
position:fixed;
bottom:0;
width:100%;
background:#222;
color:white;
padding:15px;
text-align:center;
font-size:18px;
}
</style>
</head>

<body>

<div class="header">🍉 بارینو - سفارش میوه آنلاین</div>

<div class="item">
<span>سیب (هر کیلو 50)</span>
<button onclick="add('سیب')">افزودن</button>
</div>

<div class="item">
<span>موز (هر کیلو 60)</span>
<button onclick="add('موز')">افزودن</button>
</div>

<div class="item">
<span>پرتقال (هر کیلو 40)</span>
<button onclick="add('پرتقال')">افزودن</button>
</div>

<div class="item">
<span>انگور (هر کیلو 70)</span>
<button onclick="add('انگور')">افزودن</button>
</div>

<div class="total" id="cart">
سبد خرید: خالی
</div>

<script>
let cart = [];

function add(item){
cart.push(item);
document.getElementById("cart").innerText = "سبد: " + cart.join(" , ");
}
</script>

</body>
</html>
