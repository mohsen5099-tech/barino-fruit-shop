<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>فروشگاه میوه بارینو</title>

<style>
body{font-family:tahoma;direction:rtl;margin:0;background:#f4f4f4}
header{background:#ff6a00;color:#fff;padding:15px;text-align:center;font-size:22px}
.container{padding:10px}

.item{background:#fff;margin:10px 0;padding:10px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
button{background:#28a745;color:#fff;border:none;padding:6px 10px;border-radius:8px}
.cart{background:#fff;margin:10px 0;padding:10px;border-radius:10px}
input{width:100%;padding:8px;margin:5px 0;border:1px solid #ddd;border-radius:8px}
#orderBtn{width:100%;padding:12px;background:#007bff;color:#fff;font-size:18px;border:none;border-radius:10px}
.smallBtn{background:red}
</style>
</head>

<body>

<header>🍉 بارینو | سفارش آنلاین میوه</header>

<div class="container">

<!-- محصولات -->
<div class="item">سیب (50) <button onclick="add('سیب',50)">افزودن</button></div>
<div class="item">موز (60) <button onclick="add('موز',60)">افزودن</button></div>
<div class="item">پرتقال (40) <button onclick="add('پرتقال',40)">افزودن</button></div>
<div class="item">انگور (70) <button onclick="add('انگور',70)">افزودن</button></div>

<!-- سبد -->
<div class="cart">
<h3>🛒 سبد خرید</h3>
<div id="cart"></div>
<p>جمع کل: <span id="total">0</span></p>
<button class="smallBtn" onclick="clearCart()">پاک کردن سبد</button>
</div>

<!-- اطلاعات مشتری -->
<div class="cart">
<h3>👤 اطلاعات مشتری</h3>
<input id="name" placeholder="نام">
<input id="phone" placeholder="شماره تماس">
<input id="address" placeholder="آدرس">
</div>

<button id="orderBtn" onclick="submitOrder()">ثبت سفارش + ارسال به ایتا</button>

</div>

<script>

let cart = [];

function add(name, price){
cart.push({name, price});
render();
}

function render(){
let html = "";
let total = 0;

cart.forEach((p,i)=>{
html += `
${p.name} - ${p.price}
<button onclick="removeItem(${i})">حذف</button><br>
`;
total += p.price;
});

document.getElementById("cart").innerHTML = html;
document.getElementById("total").innerText = total;
}

function removeItem(i){
cart.splice(i,1);
render();
}

function clearCart(){
cart = [];
render();
}

function submitOrder(){

let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;
let address = document.getElementById("address").value;

let total = cart.reduce((a,b)=>a+b.price,0);

let text = "🛒 سفارش جدید%0A";
text += "نام: " + name + "%0A";
text += "تلفن: " + phone + "%0A";
text += "آدرس: " + address + "%0A%0A";

cart.forEach(p=>{
text += p.name + " - " + p.price + "%0A";
});

text += "%0A💰 جمع کل: " + total;

// ذخیره سفارش داخل مرورگر (پنل ساده)
let orders = JSON.parse(localStorage.getItem("orders") || "[]");
orders.push({name,phone,address,cart,total});
localStorage.setItem("orders", JSON.stringify(orders));

// ارسال به ایتا
window.open("https://eitaa.com/share/url?text=" + text);

// پاک کردن سبد بعد سفارش
clearCart();
}

</script>

</body>
</html>
